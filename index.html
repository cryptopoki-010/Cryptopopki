<style>
:root{--out:#E7E3DB;--bg:#F6F4EF;--panel:#fff;--ink:#1A1F2B;--mute:#7A7F8C;--line:#E6E2DA;--soft:#EFEBE3;--red:#D3372A;--gold:#C79A33;--navy:#0E1B2E;

*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--out);color:var(--ink);font:400 14px/1.5 var(--f);font-variant-numeric:tabular-nums;word-break:keep-all}

.app{max-width:480px;margin:0 auto;background:var(--bg);min-height:100dvh;padding-bottom:calc(66px + env(safe-area-inset-bottom,0px));position:relative}

.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;letter-spacing:.01em}
.logo i{width:26px;height:26px;border-radius:50%;background:var(--ink);display:grid;place-items:center;border:3px solid var(--red);font:700 12px var(--f);font-style:normal;color:#F6DC8B}
.hr{display:flex;gap:8px;align-items:center}

.login{background:var(--ink);color:var(--panel);border:0;border-radius:8px;height:32px;padding:0 14px;font-weight:600}
.pad{padding:0 16px}
/* banner */
.bn{margin-top:10px;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:14px;scrollbar-width:none}

.sl{flex:0 0 100%;scroll-snap-align:start;height:clamp(104px,19dvh,160px);position:relative;overflow:hidden;color:#fff;display:flex;align-items:center;padding:0 18px}

.sl p{margin:4px 0 0;font-size:11px;opacity:.85}
.s1{background:var(--navy)}.s2{background:linear-gradient(120deg,#D3372A,#F0873A)}.s3{background:linear-gradient(120deg,#12302B,#1A8F6B)}
.sl .tx{position:relative;z-index:1;max-width:55%}
.sl svg.g{position:absolute;right:8px;bottom:6px;height:92%;width:auto}
.sl .ch{position:absolute;right:10px;top:12px;bottom:12px;width:46%;height:calc(100% - 24px)}
.bnw{position:relative}.bna{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.38);color:#fff;font:700 20px/28px var(--f);padding:0 0 2px;z-index:3;cursor:pointer;backdrop-filter:blur(4px)}.bna.l{left:6px}.bna.r{right:6px}.bna:active{background:rgba(0,0,0,.6)}.bnb{cursor:pointer}.bnb{align-items:flex-start;padding-top:clamp(10px,2.2dvh,18px)}.bnb .tx{max-width:52%}.bnb .iv b{font-size:clamp(17px,5.2vw,22px)}.bcs{position:absolute;left:44px;right:44px;bottom:7px;display:flex;gap:5px;z-index:2;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.bcs::-webkit-scrollbar{display:none}.bcs i{flex:none;font:700 10px var(--f);font-style:normal;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.12);color:#cfd8e6}.bcs i.on{background:#fff;color:#0f1a33}.bgear{position:absolute;right:8px;top:8px;width:15px;height:15px;color:rgba(255,255,255,.55);z-index:2}.bnsel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}.bnsel small{margin-left:auto;opacity:.65}.bnc{display:inline-flex;align-items:center;gap:4px;padding:5px 6px 5px 10px;border-radius:999px;background:var(--ink,#111);color:#fff;font:700 12px var(--f)}.bnc button{border:0;background:rgba(255,255,255,.2);color:#fff;width:18px;height:18px;border-radius:50%;font-size:12px;line-height:1;cursor:pointer}.bnf{display:flex;gap:8px;margin-bottom:8px}.bnf input{flex:1;height:40px;border-radius:10px;border:1px solid var(--line,#ccc);padding:0 12px;font:600 14px var(--f);background:transparent;color:inherit;min-width:0}.bnl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:34dvh;overflow:auto}.bnp{height:36px;border-radius:10px;border:1px solid var(--line,#ccc);background:transparent;color:inherit;font:700 12px var(--f);cursor:pointer}.bnp.on{background:var(--red,#D3372A);border-color:var(--red,#D3372A);color:#fff}.sl .iv{font-size:12px;color:#9FB0C8}.sl .iv b{display:block;font-size:20px;color:#fff}

.dots i.on{width:20px;background:var(--ink)}
/* quick menu */
.qk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}

.ct{position:absolute;left:0;bottom:0;display:flex;align-items:center;gap:4px;background:#2B1B0C;color:#F6DC8B;border:2px solid #C79A33;border-left:0;border-bottom:0;border-radius:0 12px 0 0;padding:3px 12px 3px 6px;font:700 14px var(--f)}
.ct svg{width:18px;height:18px}

.em{text-align:center;color:var(--mute);padding:40px 0}
.ft{margin-top:28px;padding:20px 16px 8px;border-top:1px solid var(--line);color:var(--mute);font-size:12px;line-height:1.7}
.ft div{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-weight:500;color:var(--ink)}
nav.bt{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:10}

#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:8px;transition:.2s;z-index:40;font-weight:500;white-space:nowrap}

.sheet{width:100%;max-width:480px;background:var(--panel);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88dvh;overflow:auto;animation:up .2s ease-out}

.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.mh h2{margin:0;font-size:19px}

.mt{margin:4px 0 8px;color:var(--mute)}.cd2{background:var(--soft);border-radius:10px;padding:12px;text-align:center;font:700 22px var(--f);letter-spacing:.05em;margin:8px 0}

.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.qs{display:flex;align-items:center;gap:6px}.qs button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line,#ccc);background:transparent;color:inherit;font:700 18px var(--f);cursor:pointer}.qs input{width:84px;height:34px;text-align:center;font:800 20px var(--f);border-radius:10px;border:1px solid var(--line,#ccc);background:transparent;color:inherit;-moz-appearance:textfield}.qs input::-webkit-outer-spin-button,.qs input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.qc2{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}.qc2 button{flex:1;min-width:44px;height:30px;border-radius:999px;border:1px solid var(--line,#ccc);background:transparent;color:inherit;font:700 12px var(--f);cursor:pointer}.qb{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 2px}.qb b{font-size:24px}
input[type=range]{width:100%;accent-color:var(--red);height:32px;margin:0}
.od{display:grid;grid-template-columns:auto 1fr 1.6fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.od.h{color:var(--mute);font-size:12px;padding-top:2px}.od b{font-weight:600}

.sk{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:6px 14px;font-weight:500;z-index:3}
